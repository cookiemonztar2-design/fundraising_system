<!DOCTYPE html>
<html>
    <head>
        <title>View activites</title>
    </head>

    <body>
        <h1>All current activites</h1>

        <table border="1" cellpadding="8">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Target Amount</th>
                <th>Category</th>
                <th>Deadline</th>
                <th>Status</th>
            </tr>

            {% for activity in activities %}
            <tr>
                <td>{{ activity.id }}</td>
                <td>{{ activity.title }}</td>
                <td>{{ activity.description[:30] }}</td>
                <td>{{ activity.target_amount }}</td>
                <td>{{ activity.category }}</td>
                <td>{{ activity.deadline }}</td>
                <td>{{ activity.status }}</td>
            </tr>
            {% endfor %}
        </table>

        <br>

        <a href="/dashboard">
            <button>Back to dashboard</button>
        </a>
    </body>
</html>
